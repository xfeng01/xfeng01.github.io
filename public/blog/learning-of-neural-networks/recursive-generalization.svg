<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252" role="img" aria-labelledby="title desc">
  <title id="title">Recursive generalization and capacity</title>
  <desc id="desc">Left: a branching tree. A neuron's response grows from "iy" to "diy" to "do it yourself", while gray side branches keep splitting into smaller branches. Right: with small capacity there is one broad feature; with larger capacity it splits into three more specific features.</desc>
  <defs>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <line x1="340" y1="18" x2="340" y2="238" stroke="#e5e7eb" stroke-width="1"/>

  <text x="170" y="30" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Recursive generalization</text>
