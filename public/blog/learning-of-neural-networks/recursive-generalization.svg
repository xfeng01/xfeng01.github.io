  <path d="M 110.5 184 C 150.5 184 150.5 160 190.5 160" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <path d="M 110.5 184 C 150.5 184 150.5 208 190.5 208" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <path d="M 199.5 120 C 231.5 120 231.5 108 263.5 108" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <path d="M 199.5 120 C 231.5 120 231.5 132 263.5 132" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <path d="M 199.5 160 C 231.5 160 231.5 148 263.5 148" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <path d="M 199.5 160 C 231.5 160 231.5 172 263.5 172" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <path d="M 199.5 208 C 231.5 208 231.5 196 263.5 196" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <path d="M 199.5 208 C 231.5 208 231.5 220 263.5 220" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <path d="M 60 140 C 80 140 80 96 100 96" fill="none" stroke="#374151" stroke-width="1.6"/>
  <path d="M 146 96 C 168 96 168 72 190 72" fill="none" stroke="#374151" stroke-width="1.6"/>
  <circle cx="267" cy="108" r="3.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <circle cx="267" cy="132" r="3.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <circle cx="267" cy="148" r="3.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <circle cx="267" cy="172" r="3.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <circle cx="267" cy="196" r="3.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <circle cx="267" cy="220" r="3.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <circle cx="195" cy="120" r="4.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <circle cx="195" cy="160" r="4.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <circle cx="195" cy="208" r="4.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <circle cx="105" cy="184" r="5.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
