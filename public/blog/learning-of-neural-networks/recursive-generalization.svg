  <text x="40" y="144.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#111827">iy</text>
  <rect x="100" y="84" width="46" height="24" rx="12" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="123" y="100.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#111827">diy</text>
  <rect x="190" y="60" width="126" height="24" rx="12" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="253" y="76.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#111827">do it yourself</text>

  <text x="515" y="30" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Capacity and granularity</text>
