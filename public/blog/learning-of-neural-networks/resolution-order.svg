  <title id="title">Discrete order vs. continuous information resolution</title>
  <desc id="desc">Rows for global, mid-scale and local-detail information; shading is the remaining uncertainty over generation progress. Left: each row drops to zero in a single step, one after another. Right: all rows decay smoothly and overlap in time, global earliest and fastest, local detail latest and slowest.</desc>

