<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" role="img" aria-labelledby="title desc">
  <title id="title">Joint generation vs. resolving shared structure first</title>
  <desc id="desc">Left: five frames generated jointly, with every pair of frames connected, including long-range pairs. Right: a coarse representation z is generated first and points to each frame; only faint dashed links remain between neighboring frames.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#374151"/>
    </marker>
  </defs>

  <line x1="340" y1="18" x2="340" y2="226" stroke="#e5e7eb" stroke-width="1"/>

  <g>
    <text x="170" y="30" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Joint generation</text>
    <path d="M 70 180 A 25 20 0 0 1 120 180" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <path d="M 70 180 A 50 44 0 0 1 170 180" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <path d="M 70 180 A 75 68 0 0 1 220 180" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <path d="M 70 180 A 100 92 0 0 1 270 180" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <path d="M 120 180 A 25 20 0 0 1 170 180" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <path d="M 120 180 A 50 44 0 0 1 220 180" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <path d="M 120 180 A 75 68 0 0 1 270 180" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <path d="M 170 180 A 25 20 0 0 1 220 180" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <path d="M 170 180 A 50 44 0 0 1 270 180" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <path d="M 220 180 A 25 20 0 0 1 270 180" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    <circle cx="70" cy="196" r="16" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="70" y="201" text-anchor="middle" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-size="17" fill="#111827">x<tspan font-size="11" dy="3" font-style="normal">1</tspan></text>
    <circle cx="120" cy="196" r="16" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="120" y="201" text-anchor="middle" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-size="17" fill="#111827">x<tspan font-size="11" dy="3" font-style="normal">2</tspan></text>
    <circle cx="170" cy="196" r="16" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="170" y="201" text-anchor="middle" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-size="17" fill="#111827">x<tspan font-size="11" dy="3" font-style="normal">3</tspan></text>
    <circle cx="220" cy="196" r="16" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="220" y="201" text-anchor="middle" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-size="17" fill="#111827">x<tspan font-size="11" dy="3" font-style="normal">4</tspan></text>
    <circle cx="270" cy="196" r="16" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="270" y="201" text-anchor="middle" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-size="17" fill="#111827">x<tspan font-size="11" dy="3" font-style="normal">5</tspan></text>
  </g>

  <g>
    <text x="510" y="30" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Shared structure first</text>
    <path d="M 410 212 A 25 13 0 0 0 460 212" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 460 212 A 25 13 0 0 0 510 212" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 510 212 A 25 13 0 0 0 560 212" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 560 212 A 25 13 0 0 0 610 212" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="494.5" y1="103" x2="422.1" y2="182.7" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="500.5" y1="106.9" x2="467.4" y2="179.6" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="510" y1="109" x2="510" y2="178" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="519.5" y1="106.9" x2="552.6" y2="179.6" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="525.5" y1="103" x2="597.9" y2="182.7" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="510" cy="86" r="21" fill="#1f2937"/>
    <text x="510" y="92" text-anchor="middle" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-size="19" fill="#ffffff">z</text>
    <text x="541" y="91" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">coarse representation</text>
    <circle cx="410" cy="196" r="16" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="410" y="201" text-anchor="middle" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-size="17" fill="#111827">x<tspan font-size="11" dy="3" font-style="normal">1</tspan></text>
    <circle cx="460" cy="196" r="16" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="460" y="201" text-anchor="middle" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-size="17" fill="#111827">x<tspan font-size="11" dy="3" font-style="normal">2</tspan></text>
    <circle cx="510" cy="196" r="16" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="510" y="201" text-anchor="middle" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-size="17" fill="#111827">x<tspan font-size="11" dy="3" font-style="normal">3</tspan></text>
    <circle cx="560" cy="196" r="16" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="560" y="201" text-anchor="middle" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-size="17" fill="#111827">x<tspan font-size="11" dy="3" font-style="normal">4</tspan></text>
    <circle cx="610" cy="196" r="16" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="610" y="201" text-anchor="middle" font-family="'Times New Roman', Times, Georgia, serif" font-style="italic" font-size="17" fill="#111827">x<tspan font-size="11" dy="3" font-style="normal">5</tspan></text>
  </g>
</svg>
